spring:
  application:
    name: community
  datasource:
    # 账号密码走环境变量，仓库里只留本地默认值，禁止把真实密码提交上去
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:community}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: community-pool
      maximum-pool-size: 10
      minimum-idle: 2
      # 拿不到连接最多等 3 秒就失败，避免请求线程被拖死
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 超时短一点：鉴权路径上不该被 Redis 拖住
      timeout: 2s
      connect-timeout: 2s
  web:
    resources:
      # 浏览器启发式缓存会让改过的 js/css 不生效，调试时得硬刷。
      # 这里是展示项目，静态资源体积很小，直接要求每次回源校验，省掉这类假 bug。
      cache:
        cachecontrol:
          no-cache: true
          must-revalidate: true

mybatis:
  configuration:
    # 数据库 user_id -> Java userId，省掉 resultMap 里的逐列映射
    map-underscore-to-camel-case: true
  type-aliases-package: com.community

app:
  security:
    # BCrypt 成本因子：每 +1 计算量翻倍。10 约 50-100ms/次
    bcrypt-strength: 10
  jwt:
    # HS256 要求密钥 >= 256 bit（32 字节）。这里故意不给默认值：
    # 配了 JWT_SECRET 就用它，没配则由 JwtService 启动时生成一次性随机密钥
    secret: ${JWT_SECRET:}
    issuer: community
    # 短期令牌：泄漏窗口有限；配 jti 可做登出黑名单
    ttl: 2h

server:
  port: 8080

logging:
  pattern:
    # %X{traceId:-} 从 MDC 取值：TraceIdFilter 写入后，同一请求的每条日志都会带上它
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] [%thread] %logger{36} - %msg%n"

management:
  health:
    # 让 /actuator/health 包含 db 组件：数据库连不上时状态变 DOWN
    db:
      enabled: true
  endpoints:
    web:
      exposure:
        # 白名单：只开放健康检查与信息端点，env/beans/heapdump 一律不对外
        include: health,info
  endpoint:
    health:
      # 不向匿名调用方展示数据库/磁盘等明细，只给 status
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 0.0.1-SNAPSHOT
