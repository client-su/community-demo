<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>社区 · 最新</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<main class="layout">
    <section class="main-col">
        <nav class="tabs" id="tabs">
            <a href="/" data-tab="list">最新</a>
            <a href="/?tab=hot" data-tab="hot">热榜</a>
        </nav>

        <ul class="rows" id="rows"></ul>

        <div class="state" id="empty" hidden>
            <p class="state-title" id="emptyTitle">还没有内容</p>
            <p class="state-sub" id="emptySub">第一条由你来发，发布后会立刻出现在热榜里。</p>
            <a class="btn primary" href="/submit.html" id="emptyAction">去发布</a>
        </div>

        <div class="more">
            <button type="button" class="btn ghost" id="moreBtn" hidden>加载更多</button>
        </div>
    </section>

    <aside class="side-col" id="side"></aside>
</main>

<noscript>这个页面用原生 JS 渲染，需要开启 JavaScript。</noscript>

<script type="module" src="/js/page-list.js"></script>
</body>
</html>
