<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>社区 · 管理</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<main class="layout narrow">
    <section class="main-col">
        <h1 class="page-title">管理员 · 封禁与解封</h1>

        <div class="card" id="adminRoot">
            <form class="nick-form" id="banForm" novalidate>
                <label>用户 ID
                    <input type="number" id="userId" min="1" step="1" placeholder="目标用户的 id（可在资料页查看）">
                </label>
                <div class="ban-actions">
                    <button type="button" class="btn primary" id="banBtn">封禁</button>
                    <button type="button" class="btn ghost" id="unbanBtn">解封</button>
                </div>
                <p class="muted tiny">封禁立即生效：目标用户已发出的 token 马上 403，登录也会被拒绝。解封即恢复。</p>
            </form>
        </div>
    </section>
</main>

<noscript>这个页面用原生 JS 渲染，需要开启 JavaScript。</noscript>

<script type="module" src="/js/page-admin.js"></script>
</body>
</html>
