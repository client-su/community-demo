<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>社区 · 我的资料</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<main class="layout narrow">
    <section class="main-col">
        <div class="card">
            <div class="me-head">
                <span class="avatar lg" id="avatar"></span>
                <div>
                    <h1 class="page-title" id="name"></h1>
                    <p class="muted tiny" id="username"></p>
                </div>
            </div>

            <dl class="kv">
                <div><dt>注册时间</dt><dd id="createdAt">—</dd></div>
                <div><dt>用户 ID</dt><dd id="userId">—</dd></div>
            </dl>

            <form class="nick-form" id="nickForm" novalidate>
                <label>昵称
                    <input id="nickname" name="nickname" maxlength="32" placeholder="≤32 位">
                </label>
                <button type="submit" class="btn primary" id="save">保存</button>
            </form>

            <form class="nick-form" id="pwdForm" novalidate>
                <label>原密码
                    <input type="password" id="oldPassword" autocomplete="current-password">
                </label>
                <label>新密码（8~64 位）
                    <input type="password" id="newPassword" minlength="8" maxlength="64" autocomplete="new-password">
                </label>
                <button type="submit" class="btn primary" id="pwdSave">修改密码</button>
                <p class="muted tiny">改密成功后当前登录立即失效，需要重新登录。</p>
            </form>

            <button type="button" class="btn ghost" id="signout">退出登录</button>
        </div>

        <nav class="tabs" id="meTabs">
            <a href="#" data-tab="contents" class="active">我发布的</a>
            <a href="#" data-tab="likes">我赞过的</a>
            <a href="#" data-tab="bookmarks">我收藏的</a>
        </nav>

        <ul class="rows" id="rows"></ul>

        <div class="state" id="empty" hidden>
            <p class="state-title" id="emptyTitle">还没有内容</p>
            <p class="state-sub" id="emptySub">去写点东西吧。</p>
        </div>

        <div class="more">
            <button type="button" class="btn ghost" id="moreBtn" hidden>加载更多</button>
        </div>
    </section>
</main>

<noscript>这个页面用原生 JS 渲染，需要开启 JavaScript。</noscript>

<script type="module" src="/js/page-me.js"></script>
</body>
</html>
